name: Commit-forfatter

# Alle commits skal stå med William som forfatter og committer – aldrig Claude,
# og uden Co-Authored-By/Claude-Session-trailers (se CLAUDE.md → Git).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Ingen Claude som forfatter, committer eller i trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            commits=$(git rev-list "$BASE..$HEAD")
          else
            commits=$(git rev-list --max-count=1 "$HEAD")
          fi
          fail=0
          for c in $commits; do
            who=$(git log -1 --format='%an <%ae> / %cn <%ce>' "$c")
            if echo "$who" | grep -qiE 'claude|anthropic'; then
              echo "::error::${c:0:7} har Claude som forfatter eller committer: $who"; fail=1
            fi
            if git log -1 --format=%B "$c" | grep -qiE '^(co-authored-by:.*(claude|anthropic)|claude-session:)'; then
              echo "::error::${c:0:7} har Claude-trailers i commit-beskeden"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "OK: $(echo "$commits" | wc -w) commit(s) tjekket"
          exit $fail
